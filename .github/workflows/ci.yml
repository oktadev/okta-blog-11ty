name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on:
      group: chonky-builds
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Front-matter integrity (required fields, author keys, YAML, types).
      # The full build is intentionally left to build.yml, which builds and fails
      # on broken output for both deploys and PR previews.
      - run: npm run validate

      # Asset checks (5MB ceiling, .DS_Store, raster width) on the files this
      # push or PR changes. Same script as the pre-commit hook.
      - run: npm run validate-images -- --since "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      # Content lint (placeholder domains, curly quotes, absolute blog links)
      # on the posts this push or PR changes. Same script as the pre-commit hook.
      - run: npm run lint-content -- --since "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
