name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Front-matter integrity (required fields, author keys, YAML, types).
      # The full build is intentionally left to Netlify, which already builds
      # and fails on broken output for both deploys and PR previews.
      - run: npm run validate
