name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Deploy previews are built here, not on Vercel, so VERCEL_URL isn't
      # available. Pass the preview alias (set in preview.yml) explicitly so
      # absolute URLs (canonical, og:url, og:image, feed) point at the preview.
      - run: npm run build
        env:
          SITE_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--{1}.vercel.app', github.event.pull_request.number, github.event.repository.name) || '' }}

      - run: npm run smoke

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/

      - name: Save PR metadata
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.pull_request.number }}" > pr_number.txt
          echo "${{ github.event.pull_request.head.sha }}" > pr_sha.txt

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: pr-metadata
          path: |
            pr_number.txt
            pr_sha.txt

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site/

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create prebuilt output
        run: |
          mkdir -p .vercel/output/static
          cp -r _site/. .vercel/output/static/
          node - << 'EOF'
          const fs = require('fs');
          const vercelConfig = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const routes = [];
          for (const r of (vercelConfig.redirects || [])) {
            routes.push({
              src: r.source,
              headers: { Location: r.destination },
              status: r.permanent ? 301 : 302,
            });
          }
          for (const rule of (vercelConfig.headers || [])) {
            const headers = {};
            for (const h of rule.headers) headers[h.key] = h.value;
            routes.push({ src: rule.source, headers, continue: true });
          }
          fs.writeFileSync(
            '.vercel/output/config.json',
            JSON.stringify({ version: 3, routes }, null, 2)
          );
          EOF

      - name: Deploy to Vercel
        run: |
          prod_flag=""
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            prod_flag="--prod"
          fi
          vercel deploy --prebuilt --yes $prod_flag --token=${{ secrets.VERCEL_TOKEN }}
