name: Deploy Preview

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  deployments: write

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  deploy-preview:
    runs-on:
      group: chonky-builds
    if: github.event.workflow_run.event == 'pull_request'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: pr-metadata
          path: pr-metadata/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata
        id: pr
        run: |
          echo "number=$(cat pr-metadata/pr_number.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat pr-metadata/pr_sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Set pending deploy-preview status
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.sha }}',
              state: 'pending',
              context: 'deploy-preview',
              description: 'Deploying preview...',
            });

      - name: Fail if build did not succeed
        if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo "Build conclusion: ${{ github.event.workflow_run.conclusion }} - skipping preview deploy."
          exit 1

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create prebuilt output
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -r _site/. .vercel/output/static/
          node - << 'EOF'
          const fs = require('fs');
          // workflow_run jobs check out the default branch, so the vercel.json
          // in this checkout is main's. Use the PR's copy from the build
          // artifact; fall back for artifacts produced before it was included.
          const configPath = fs.existsSync('pr-metadata/vercel.json')
            ? 'pr-metadata/vercel.json'
            : 'vercel.json';
          const vercelConfig = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const routes = [];

          // Redirects first
          for (const r of (vercelConfig.redirects || [])) {
            routes.push({
              src: r.source,
              headers: { Location: r.destination },
              status: r.permanent ? 301 : 302,
            });
          }

          // Headers (continue so subsequent routes still resolve files)
          for (const rule of (vercelConfig.headers || [])) {
            const headers = {};
            for (const h of rule.headers) headers[h.key] = h.value;
            routes.push({ src: rule.source, headers, continue: true });
          }
          // Anything the filesystem can't serve answers 404 with the shared
          // developer.okta.com error page, as the live blog does.
          routes.push({ handle: "error" });
          routes.push({
            src: "/.*",
            dest: "https://developer.okta.com/errors/404.html",
            status: 404,
          });

          fs.writeFileSync(
            '.vercel/output/config.json',
            JSON.stringify({ version: 3, routes }, null, 2)
          );
          console.log(`Generated config.json with ${routes.length} routes from ${configPath}`);
          EOF

      - name: Deploy to Vercel
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --yes)"
          echo "Deployment URL: ${deployment_url}"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Alias preview deployment
        id: alias
        run: |
          alias_url="deploy-preview-${{ steps.pr.outputs.number }}--${{ github.event.repository.name }}.vercel.app"
          vercel alias "${{ steps.deploy.outputs.deployment_url }}" "${alias_url}" --scope okta-dev-advocacy
          echo "alias_url=${alias_url}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub deployment record
        if: success()
        id: gh_deployment
        uses: actions/github-script@v8
        env:
          COMMIT_SHA: ${{ steps.pr.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: https://${{ steps.alias.outputs.alias_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.COMMIT_SHA,
              auto_merge: false,
              required_contexts: [],
              environment: `preview/pr-${process.env.PR_NUMBER}`,
              description: `PR #${process.env.PR_NUMBER} preview deployment`,
              production_environment: false,
              transient_environment: true,
            });

            core.setOutput('deployment_id', String(deployment.data.id));

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: process.env.PREVIEW_URL,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Comment PR with deployment info
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: https://${{ steps.alias.outputs.alias_url }}
          COMMIT_SHA: ${{ steps.pr.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = process.env.COMMIT_SHA.slice(0, 7);
            const previewUrl = process.env.PREVIEW_URL;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;

            const body = [
              `## Deploy Preview for **${context.repo.repo}** ready!`,
              '',
              '| | |',
              '|---|---|',
              `| Latest commit | \`${sha}\` |`,
              `| Deploy log | [GitHub Actions](${runUrl}) |`,
              `| Preview URL | ${previewUrl} |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.findLast(
              (c) => c.user.login === 'github-actions[bot]' &&
                     c.body.includes(`Deploy Preview for **${context.repo.repo}**`)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Report Deploy Preview to Vercel status
        if: always()
        uses: actions/github-script@v8
        env:
          COMMIT_SHA: ${{ steps.pr.outputs.sha }}
          DEPLOYMENT_ID: ${{ steps.gh_deployment.outputs.deployment_id }}
          PREVIEW_URL: https://${{ steps.alias.outputs.alias_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const description = state === 'success'
              ? 'Preview deployment completed'
              : 'Preview deployment failed';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT_SHA,
              state,
              context: 'deploy-preview',
              description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

            if (process.env.DEPLOYMENT_ID) {
              const deploymentState = state === 'success' ? 'success' : 'failure';
              const deploymentStatus = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: Number(process.env.DEPLOYMENT_ID),
                state: deploymentState,
                log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              };

              if (state === 'success' && process.env.PREVIEW_URL) {
                deploymentStatus.environment_url = process.env.PREVIEW_URL;
              }

              await github.rest.repos.createDeploymentStatus(deploymentStatus);
            }
