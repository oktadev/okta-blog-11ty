name: Vercel Preview Deployment

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: pr-metadata
          path: pr-metadata/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata
        id: pr
        run: |
          echo "number=$(cat pr-metadata/pr_number.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat pr-metadata/pr_sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create prebuilt output
        run: |
          mkdir -p .vercel/output/static
          cp -r _site/. .vercel/output/static/
          node - << 'EOF'
          const fs = require('fs');
          const vercelConfig = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const routes = [];
          for (const r of (vercelConfig.redirects || [])) {
            routes.push({
              src: r.source,
              headers: { Location: r.destination },
              status: r.permanent ? 301 : 302,
            });
          }
          for (const rule of (vercelConfig.headers || [])) {
            const headers = {};
            for (const h of rule.headers) headers[h.key] = h.value;
            routes.push({ src: rule.source, headers, continue: true });
          }
          fs.writeFileSync(
            '.vercel/output/config.json',
            JSON.stringify({ version: 3, routes }, null, 2)
          );
          EOF

      - name: Deploy to Vercel
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          COMMIT_SHA: ${{ steps.pr.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = process.env.COMMIT_SHA.slice(0, 7);
            const previewUrl = process.env.PREVIEW_URL;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;

            const body = [
              `## Deploy Preview for **${context.repo.repo}** ready!`,
              '',
              '| | |',
              '|---|---|',
              `| Latest commit | \`${sha}\` |`,
              `| Deploy log | [GitHub Actions](${runUrl}) |`,
              `| Preview URL | ${previewUrl} |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.findLast(
              (c) => c.user.login === 'github-actions[bot]' &&
                     c.body.includes(`Deploy Preview for **${context.repo.repo}**`)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
